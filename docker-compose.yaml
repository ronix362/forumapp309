version: '3.8'

services:
  db:
    image: postgres:alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379" # Accessible via localhost:6379 for local dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    command: sh -c "./docker-startup.sh"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/mydb"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs cron worker for updating match/standings data
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm run worker"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/mydb"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: always

volumes:
  db-data: